# Chi risponde, sotto minerva-wayland, alle domande che i programmi fanno
# alla scrivania.
#
# ── Perché ce ne vuole uno SUO, diverso da minerva-portals.conf ───────────
#
# Un programma non parla con Minerva: parla con `xdg-desktop-portal`, che gira
# la domanda («apri un file», «fai una foto dello schermo», «fammi condividere
# lo schermo») al pezzo di scrivania che sa rispondere. Quale pezzo, lo decide
# un file scelto in base a `XDG_CURRENT_DESKTOP`.
#
# Sotto Hyprland quel pezzo è `xdg-desktop-portal-hyprland`, ed è la scelta
# giusta lì. Ma xdph, per lavorare, cerca `HYPRLAND_INSTANCE_SIGNATURE` —
# verificato il 30 agosto 2026 leggendo le stringhe dentro il suo binario.
# Dentro minerva-wayland quella variabile non esiste e non esisterà mai.
#
# Il difetto che ne veniva è del tipo peggiore: **non dà errore.** Il portale
# sceglie un backend che non riesce a parlare col compositore, la richiesta
# resta senza risposta, e il programma non lo dice — condivisione dello schermo
# muta, finestra «apri file» che non si apre. È parola per parola il modo in
# cui era caduto il portachiavi di Chrome l'11 agosto 2026, e la lezione di
# quella sera era: **la risposta di «nessuno» non è un errore visibile, è un
# silenzio.**
#
# ── Perché «wlr», e perché funziona davvero ──────────────────────────────
#
# `xdg-desktop-portal-wlr` non conosce Hyprland: parla i protocolli di
# wlroots — `wlr-screencopy` per fotografare e trasmettere lo schermo,
# `xdg-output` per sapere quali schermi ci sono. **Sono tutti e due fra i 21
# che minerva-wayland implementa**, quindi non è una speranza: è una cosa
# verificabile con `wayland-info`.
#
# Se il pacchetto non è installato, `xdg-desktop-portal` scende alla voce dopo
# e usa `gtk`: si perdono schermate e condivisione schermo, si tengono le
# finestre «apri file». Nessuna riga rossa, ma nemmeno nessun silenzio
# inspiegabile — ed è il motivo per cui l'elenco ne ha due e non uno.
#
# ── E i segreti restano dove stanno ──────────────────────────────────────
#
# `org.freedesktop.impl.portal.Secret=gnome-keyring` è ripetuto qui e non
# ereditato: questo file viene scelto INVECE di `minerva-portals.conf`, non
# insieme a lui. Dimenticarlo vorrebbe dire che Chrome torna a cifrare le
# password con una chiave di ripiego e alla prossima sessione le chiede da
# capo — «sincronizzazione sospesa», che è già successo.

[preferred]
default=wlr;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
