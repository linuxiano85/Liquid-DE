# Chi risponde, in Minerva, alle domande che i programmi fanno alla scrivania.
#
# ── Perché questo file esiste ────────────────────────────────────────────
#
# Un programma non parla con Minerva: parla con `xdg-desktop-portal`, che
# gira una domanda («apri un file», «fai una foto dello schermo», «tienimi
# questa chiave») al pezzo di scrivania che sa rispondere. Quale pezzo, lo
# decide questo file, scelto in base a `XDG_CURRENT_DESKTOP`.
#
# Con `Minerva:Hyprland` e nessun file nostro, il portale ricadeva su
# `hyprland-portals.conf`, che dice soltanto:
#
#     default=hyprland;gtk
#
# Per «apri un file» va benissimo. Per i SEGRETI no: né il portale di
# Hyprland né quello di GTK offrono `org.freedesktop.impl.portal.Secret`.
# Nessuno rispondeva, e la risposta di «nessuno» non è un errore visibile:
# è un silenzio.
#
# ── Cosa costava quel silenzio ───────────────────────────────────────────
#
# Chrome chiede al portale la chiave con cui cifra le password e i gettoni
# di accesso. In Minerva la richiesta falliva, e Chrome ripiegava sul suo
# archivio in chiaro — una chiave diversa. Rientrando in KDE, dove il
# portale risponde, trovava roba cifrata con l'altra chiave: password da
# riscrivere e «sincronizzazione sospesa».
#
# L'ha scritto lui stesso, nel suo `Local State`, l'11 agosto 2026:
#
#     "os_crypt":{"portal":{"prev_desktop":"Minerva:Hyprland",
#                           "prev_init_success":false}}
#
# `gnome-keyring` offre quell'interfaccia ed è già in funzione (unit utente
# di systemd, indipendente dalla scrivania). Bastava dirgli di rispondere.
# `kwallet` la offre anche lui: si mette gnome-keyring perché è quello che
# gira senza tirarsi dietro mezzo Plasma.

[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
