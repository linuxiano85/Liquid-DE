# Chi risponde, dentro Liquid DE, alle domande che i programmi fanno alla
# scrivania: «apri un file», «fotografa lo schermo», «fammi condividere lo
# schermo», «dove tengo le password».
#
# I programmi non parlano con la scrivania ma con `xdg-desktop-portal`, che
# sceglie questo file dal primo nome di XDG_CURRENT_DESKTOP (`LiquidDE`, messo
# da `scripts/start-minerva-wayland.sh`). Lo installa
# `scripts/install-minerva.sh` in ~/.config/xdg-desktop-portal/.
#
# ── wlr, poi gtk ─────────────────────────────────────────────────────────
#
# `xdg-desktop-portal-wlr` parla i protocolli di wlroots — `wlr-screencopy`
# per fotografare e trasmettere lo schermo, `xdg-output` per sapere quali
# schermi ci sono — e il nostro compositore li implementa tutti e due
# (verificabile con `wayland-info`). Per il resto (le finestre «apri file»)
# risponde quello di GTK.
#
# Un portale che sceglie un backend che non sa parlare col compositore non dà
# errore: la richiesta resta senza risposta e il programma non lo dice. È per
# questo che il backend si sceglie qui, per nome, e non si lascia indovinare.
#
# ── I segreti ────────────────────────────────────────────────────────────
#
# Senza qualcuno che risponda a `org.freedesktop.impl.portal.Secret`, Chrome
# cifra le password con una chiave di ripiego e alla sessione dopo le chiede
# da capo («sincronizzazione sospesa»). Oggi risponde gnome-keyring; quando
# ci sarà Minerva Chiavi, risponderà lei.

# ── «Con che cosa lo apro?» ──────────────────────────────────────────────
#
# Quando un programma apre un file di un tipo senza programma predefinito, il
# portale fa scegliere. Con `gtk` compariva la finestra di GTK col pulsante
# per GNOME Software, che qui non c'è; con `liquidde` compare la stessa
# finestrella del gestore file (`scripts/minerva-portale`, dichiarato da
# `config/xdg-desktop-portal/liquidde.portal`). `gtk` resta dietro: se il
# nostro non è installato, si torna a quella di prima e non a nessuna.

[preferred]
default=wlr;gtk
org.freedesktop.impl.portal.AppChooser=liquidde;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
