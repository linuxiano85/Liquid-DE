name: Shell regressions

on:
  pull_request:
    paths:
      - 'minerva-shell/**'
      - 'minervad/**'
      - 'tests/desktop_launcher_test.dart'
      - 'tests/**'
      - 'tests/test_greeter_state.py'
      - 'scripts/minerva-greetd'
      - 'scripts/minerva-greeter-state.py'
      - 'scripts/minerva-blocca'
      - 'scripts/install-minerva.sh'
      - 'compositore/src/minerva-pam.c'
      - 'compositore/meson.build'
      - 'compositore/costruisci.sh'
      - 'config/pam/**'
      - '.github/workflows/shell-regressions.yml'
  push:
    branches: [principale, 'codex/shell-*']
    paths:
      - 'minerva-shell/**'
      - 'minervad/**'
      - 'tests/desktop_launcher_test.dart'
      - 'tests/**'
      - 'tests/test_greeter_state.py'
      - 'scripts/minerva-greetd'
      - 'scripts/minerva-greeter-state.py'
      - 'scripts/minerva-blocca'
      - 'scripts/install-minerva.sh'
      - 'compositore/src/minerva-pam.c'
      - 'compositore/meson.build'
      - 'compositore/costruisci.sh'
      - 'config/pam/**'
      - '.github/workflows/shell-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test production JS bodies and generated commands
        run: node --test tests/shell-regressions.mjs

  wifi-credentials:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare nmcli client without installing or starting NetworkManager
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-dbusmock libnm0
          nmcli_test_tools=$(mktemp -d)
          cd "$nmcli_test_tools"
          apt-get download network-manager
          dpkg-deb -x ./*.deb client
          echo "$nmcli_test_tools/client/usr/bin" >> "$GITHUB_PATH"
      - name: Check Wi-Fi test syntax
        run: python3 -m py_compile tests/test_wifi_nmcli.py
      - name: Test real nmcli pipes and SecretAgent on a private bus
        run: sudo env "PATH=$PATH" /usr/bin/python3 tests/test_wifi_nmcli.py

  greeter-filesystem:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse login coordinator and compile its Python helper
        run: |
          sh -n scripts/minerva-greetd
          python3 -m py_compile scripts/minerva-greeter-state.py
      - name: Test real UID transitions and temporary greeter files
        run: sudo env REQUIRE_GREETER_PRIVILEGES=1 python3 tests/test_greeter_state.py

  desktop-launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12'
      - name: Install daemon development dependencies
        working-directory: minervad
        run: dart pub get
      - name: Test Fucina orchestration and recovery regressions
        working-directory: tests/fucina_suite
        run: |
          dart pub get
          dart test --reporter expanded
      - name: Test launcher races and isolated maintenance package removal
        run: python3 tests/test_recovery_scripts.py
      - name: Analyze the launch guard
        working-directory: minervad
        run: dart analyze lib/services/desktop_launcher.dart
      - name: Compile the full daemon to check IPC integration
        working-directory: minervad
        run: dart compile kernel bin/minervad.dart -o /tmp/minervad-check.dill
      - name: Test consent and real temporary launcher files
        run: dart run tests/desktop_launcher_test.dart
      - name: Analyze login transport and ownership
        working-directory: minervad
        run: dart analyze --fatal-infos lib/services/greetd_service.dart lib/services/greetd_conversation.dart
      - name: Test login ownership and real temporary Unix sockets
        run: dart run tests/greetd_conversation_test.dart

# The preceding jobs cover logic and isolated services. The native job below
# adds production QML rendering and real PAM, but not a secure Wayland lock
# or a full greetd session on hardware.

  native-graphics-pam:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: archlinux:base
      options: --cap-add=SYS_PTRACE
    steps:
      - uses: actions/checkout@v4
      - name: Install native graphical and authentication runtime
        run: pacman -Syu --noconfirm --needed quickshell xorg-server-xvfb mesa qt6-svg qt6-5compat qt6-multimedia ttf-dejavu adwaita-fonts noto-fonts xdotool dbus python shadow util-linux procps-ng gdb gcc
      - name: Run real QML and PAM in disposable container
        env:
          LIQUID_NATIVE_CI: '1'
        run: bash tests/native/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-graphics-pam
          path: native-results/

  native-apps-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: archlinux:base
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable native app runtime
        run: pacman -Syu --noconfirm --needed quickshell xorg-server-xvfb mesa qt6-svg qt6-5compat qt6-multimedia qt6-websockets ttf-dejavu adwaita-fonts noto-fonts xdotool dbus python shadow util-linux imagemagick
      - name: Test production Fucina and File Manager windows
        run: |
          useradd -m liquidapps
          chown liquidapps:liquidapps minerva-shell/filemanager.qml
          mkdir -p native-results /tmp/liquid-apps-runtime
          chown liquidapps:liquidapps native-results /tmp/liquid-apps-runtime
          chmod 700 /tmp/liquid-apps-runtime
          Xvfb :98 -screen 0 1360x900x24 -nolisten tcp > native-results/xvfb-apps.log 2>&1 &
          for i in $(seq 1 50); do [ -S /tmp/.X11-unix/X98 ] && break; sleep .1; done
          runuser -u liquidapps -- env DISPLAY=:98 XDG_RUNTIME_DIR=/tmp/liquid-apps-runtime QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software LIBGL_ALWAYS_SOFTWARE=1 dbus-run-session -- python tests/native/test_apps_recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-apps-recovery
          path: native-results/
