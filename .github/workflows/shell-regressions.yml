name: Shell regressions

on:
  pull_request:
    paths:
      - 'minerva-shell/**'
      - 'minervad/**'
      - 'tests/desktop_launcher_test.dart'
      - 'tests/**'
      - 'tests/test_greeter_state.py'
      - 'scripts/minerva-greetd'
      - 'scripts/minerva-greeter-state.py'
      - '.github/workflows/shell-regressions.yml'
  push:
    branches: [principale, 'codex/shell-*']
    paths:
      - 'minerva-shell/**'
      - 'minervad/**'
      - 'tests/desktop_launcher_test.dart'
      - 'tests/**'
      - 'tests/test_greeter_state.py'
      - 'scripts/minerva-greetd'
      - 'scripts/minerva-greeter-state.py'
      - '.github/workflows/shell-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test production JS bodies and generated commands
        run: node --test tests/shell-regressions.mjs

  wifi-credentials:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare nmcli client without installing or starting NetworkManager
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-dbusmock libnm0
          nmcli_test_tools=$(mktemp -d)
          cd "$nmcli_test_tools"
          apt-get download network-manager
          dpkg-deb -x ./*.deb client
          echo "$nmcli_test_tools/client/usr/bin" >> "$GITHUB_PATH"
      - name: Check Wi-Fi test syntax
        run: python3 -m py_compile tests/test_wifi_nmcli.py
      - name: Test real nmcli pipes and SecretAgent on a private bus
        run: sudo env "PATH=$PATH" /usr/bin/python3 tests/test_wifi_nmcli.py

  greeter-filesystem:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse login coordinator and compile its Python helper
        run: |
          sh -n scripts/minerva-greetd
          python3 -m py_compile scripts/minerva-greeter-state.py
      - name: Test real UID transitions and temporary greeter files
        run: sudo env REQUIRE_GREETER_PRIVILEGES=1 python3 tests/test_greeter_state.py

  desktop-launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12'
      - name: Install daemon development dependencies
        working-directory: minervad
        run: dart pub get
      - name: Analyze the launch guard
        working-directory: minervad
        run: dart analyze lib/services/desktop_launcher.dart
      - name: Compile the full daemon to check IPC integration
        working-directory: minervad
        run: dart compile kernel bin/minervad.dart -o /tmp/minervad-check.dill
      - name: Test consent and real temporary launcher files
        run: dart run tests/desktop_launcher_test.dart

# These tests intentionally do not claim QML loading, real PAM/polkit,
# NetworkManager integration or GUI/hardware verification.
