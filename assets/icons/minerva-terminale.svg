<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Minerva Terminale — una finestra con il prompt: la freccia che chiede e
       il cursore che aspetta. Lo stesso tratto e la stessa tinta delle altre
       icone di Minerva, così nella dock sono una famiglia e non una raccolta. -->
  <defs>
    <linearGradient id="tinta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect x="6" y="9" width="36" height="30" rx="5" fill="none" stroke="url(#tinta)" stroke-width="2.4"/>
  <path d="M 6 16 L 42 16" stroke="url(#tinta)" stroke-width="1.6" opacity="0.6"/>
  <path d="M 14 22 L 20 27 L 14 32" fill="none" stroke="#7CC4E8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 24 32 L 32 32" stroke="#7CC4E8" stroke-width="2.4" stroke-linecap="round"/>
</svg>
