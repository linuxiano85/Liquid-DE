<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Minerva Terminale — una finestra con il prompt: la freccia che chiede e
       il cursore che aspetta. Piastrella sfumata e segno bianco come le altre
       icone di Minerva (dal 4 ottobre 2026: a solo contorno, sul tema chiaro
       diventava azzurro pallido su grigio — E3). -->
  <defs>
    <linearGradient id="tinta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="luce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="42" height="42" rx="12.5" fill="url(#tinta)"/>
  <rect x="3" y="3" width="42" height="42" rx="12.5" fill="url(#luce)"/>
  <rect x="10" y="12" width="28" height="24" rx="4.5" fill="#FFFFFF" fill-opacity=".16" stroke="#FFFFFF" stroke-width="2.2"/>
  <path d="M 10 17.5 L 38 17.5" stroke="#FFFFFF" stroke-width="1.6" stroke-opacity=".6"/>
  <path d="M 15.5 22.5 L 20 26.5 L 15.5 30.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 23.5 30.5 L 31 30.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
</svg>
