<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Minerva Editor — un foglio con le righe di testo, piegato nell'angolo
       come ogni documento. Il segno deve restare leggibile a quattordici
       pixel, che è la dimensione a cui vive davvero. Piastrella sfumata e
       foglio bianco come le altre icone di Minerva (E3, 4 ottobre 2026). -->
  <defs>
    <linearGradient id="tinta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="luce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="42" height="42" rx="12.5" fill="url(#tinta)"/>
  <rect x="3" y="3" width="42" height="42" rx="12.5" fill="url(#luce)"/>
  <path d="M 14.5 9.5 L 28 9.5 L 34.5 16 L 34.5 38.5 L 14.5 38.5 Z" fill="#FFFFFF"/>
  <path d="M 28 9.5 L 28 16 L 34.5 16 Z" fill="#FFFFFF" fill-opacity=".55"/>
  <path d="M 18.5 22 L 30.5 22 M 18.5 27 L 30.5 27 M 18.5 32 L 26 32" stroke="#5B6BE0" stroke-width="2" stroke-linecap="round"/>
</svg>
