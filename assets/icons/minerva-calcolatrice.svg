<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Minerva Calcolatrice — una scacchiera di tasti con un display in
       cima. Il segno deve restare leggibile a quattordici pixel, che è la
       dimensione a cui vive davvero. -->
  <defs>
    <linearGradient id="tinta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect x="8" y="6" width="32" height="10" rx="2.5" fill="none" stroke="url(#tinta)" stroke-width="2.4"/>
  <rect x="8" y="22" width="7" height="7" rx="1.8" fill="none" stroke="#7CC4E8" stroke-width="2"/>
  <rect x="16.5" y="22" width="7" height="7" rx="1.8" fill="none" stroke="#7CC4E8" stroke-width="2"/>
  <rect x="25" y="22" width="7" height="7" rx="1.8" fill="none" stroke="#7CC4E8" stroke-width="2"/>
  <rect x="33.5" y="22" width="7" height="7" rx="1.8" fill="none" stroke="url(#tinta)" stroke-width="2"/>
  <rect x="8" y="31" width="7" height="7" rx="1.8" fill="none" stroke="#7CC4E8" stroke-width="2"/>
  <rect x="16.5" y="31" width="7" height="7" rx="1.8" fill="none" stroke="#7CC4E8" stroke-width="2"/>
  <rect x="25" y="31" width="7" height="7" rx="1.8" fill="none" stroke="#7CC4E8" stroke-width="2"/>
  <rect x="33.5" y="31" width="7" height="15.5" rx="1.8" fill="url(#tinta)"/>
</svg>
