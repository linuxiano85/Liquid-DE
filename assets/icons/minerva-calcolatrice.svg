<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Minerva Calcolatrice — il visore e i tasti, con «=» lungo in basso a
       destra. Piastrella sfumata e segno bianco come le altre icone di
       Minerva (E3, 4 ottobre 2026). -->
  <defs>
    <linearGradient id="tinta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="luce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="42" height="42" rx="12.5" fill="url(#tinta)"/>
  <rect x="3" y="3" width="42" height="42" rx="12.5" fill="url(#luce)"/>
  <rect x="11" y="10" width="26" height="8" rx="2.5" fill="#FFFFFF"/>
  <g fill="#FFFFFF" fill-opacity=".6">
    <rect x="11" y="21.5" width="5.5" height="5.5" rx="1.6"/>
    <rect x="18.5" y="21.5" width="5.5" height="5.5" rx="1.6"/>
    <rect x="26" y="21.5" width="5.5" height="5.5" rx="1.6"/>
    <rect x="11" y="29.5" width="5.5" height="5.5" rx="1.6"/>
    <rect x="18.5" y="29.5" width="5.5" height="5.5" rx="1.6"/>
    <rect x="26" y="29.5" width="5.5" height="5.5" rx="1.6"/>
  </g>
  <rect x="33.5" y="21.5" width="3.5" height="13.5" rx="1.6" fill="#FFFFFF"/>
</svg>
