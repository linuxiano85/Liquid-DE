<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Minerva Custodia — la freccia che torna indietro dentro un cerchio:
       il gesto del programma, non l'oggetto su cui lavora. Una cassaforte o
       una cartella direbbero «dove»; questo dice «cosa fa». -->
  <defs>
    <linearGradient id="tinta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="luce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="42" height="42" rx="12.5" fill="url(#tinta)"/>
  <rect x="3" y="3" width="42" height="42" rx="12.5" fill="url(#luce)"/>
  <!-- Il giro, aperto in alto a sinistra per lasciar posto alla punta. -->
  <path d="M14.2 19.6A11.2 11.2 0 1 1 12.8 24"
        fill="none" stroke="#FFFFFF" stroke-width="3.2"
        stroke-linecap="round"/>
  <!-- La punta della freccia: indica indietro. -->
  <path d="M8.2 18.4l4.9 1.5 1.6-4.9"
        fill="none" stroke="#FFFFFF" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Il punto al centro: l'istante a cui si torna. -->
  <circle cx="24" cy="24" r="3.4" fill="#FFFFFF"/>
</svg>
